# /etc/nginx/sites-available/ideabloom.ali-moradi-develop.com  (symlink into sites-enabled)
# Static build served from /srv/static/ideabloom (rsynced by CI). Always run `nginx -t` first.
#
# First time: put only the port-80 server in place, run
#   sudo certbot --nginx -d ideabloom.ali-moradi-develop.com
# then keep the paths certbot wrote in the 443 block below.
# Copy ideabloom-security-headers.conf to /etc/nginx/snippets/.

server {
    listen 80;
    listen [::]:80;
    server_name ideabloom.ali-moradi-develop.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ideabloom.ali-moradi-develop.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/ideabloom.ali-moradi-develop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ideabloom.ali-moradi-develop.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /srv/static/ideabloom;
    index index.html;

    # The app only ever needs GET/HEAD.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    client_max_body_size 1k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    include snippets/ideabloom-security-headers.conf;

    # Never serve dotfiles or source maps.
    location ~ /\.      { return 404; }
    location ~ \.map$   { return 404; }

    # Hashed build output never changes: cache for a year.
    location /assets/ {
        include snippets/ideabloom-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # These must always be revalidated or updates (and the service worker) get stuck.
    location = /sw.js {
        include snippets/ideabloom-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ~* ^/(index\.html|theme-init\.js|manifest\.webmanifest)$ {
        include snippets/ideabloom-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include snippets/ideabloom-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
