name: Deploy

# Builds in CI and rsyncs the static files to the VPS. The server never builds anything.
# Required repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
# (output of `ssh-keyscan -p 9011 <host>`). Use a dedicated deploy user that can only write
# /srv/static/ideabloom.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Upload (assets first, entry points last)
        run: |
          SSH="ssh -p 9011 -i ~/.ssh/id_ed25519"
          DEST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/static/ideabloom/"
          rsync -az -e "$SSH" --exclude index.html --exclude sw.js dist/ "$DEST"
          rsync -az --delete -e "$SSH" dist/ "$DEST"
