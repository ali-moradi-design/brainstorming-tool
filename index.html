<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ideabloom</title>
    <meta name="theme-color" content="#124e78" />
    <meta name="description" content="Ideabloom: a local-first mind map for your ideas." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // Apply stored theme/language before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('bt:theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        var l = localStorage.getItem('bt:lang') || 'en';
        var d = document.documentElement;
        d.dataset.theme = t;
        d.lang = l;
        d.dir = l === 'fa' ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
