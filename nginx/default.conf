# Nginx inside the container: serves the static build (dist). The host Nginx in front
# of it terminates TLS and compresses responses (deploy/nginx.conf).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # behind a proxy the host name in redirects would be wrong; keep them relative
    absolute_redirect off;

    # The app only ever needs GET/HEAD.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve dotfiles or source maps.
    location ~ /\.      { return 404; }
    location ~ \.map$   { return 404; }

    # Hashed build output never changes: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # These must always be revalidated or updates (and the service worker) get stuck.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    # The base image's mime.types has no .webmanifest type (nosniff would then block it).
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location ~* ^/(index\.html|theme-init\.js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
